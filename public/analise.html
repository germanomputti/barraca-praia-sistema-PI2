<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Dashboard - Barraca de Praia</title>
  <link rel="stylesheet" href="style.css"/>
  <!-- Chart.js precisa ser carregado antes do script -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>

<body>
  <header>
    <h1 class="titulo-analise">📊 Análise de Vendas — Barraca de Praia</h1>
  </header>

  <main class="dashboard">
          <div class="filtro-container">
  <label for="yearFilter">Filtrar por ano:</label>
  <select id="yearFilter">
    <option value="__ALL__" selected>Todos os anos</option>
  </select>
</div>
<div class="filtro-container">
  <label for="productFilter">Filtrar produto:</label>
  <select id="productFilter"></select>
</div>
<button class="btn danger" onclick="clearDB()">🗑 Apagar tudo do banco</button>
<button class="btn alt" onclick="runSeed()">🌱 Gerar dados simulados</button>

<div id="seedLog" style="font-family:monospace;font-size:13px;white-space:pre-line;
background:#000;color:#0f0;padding:10px;display:none;border-radius:8px;margin:10px 0;">
</div>

    <div class="graficos-container">
      <div class="grafico-card">
        <canvas id="chart1"></canvas>
      </div>
      <div class="grafico-card">
        <canvas id="chart2"></canvas>
      </div>
      <div class="grafico-card">
        <canvas id="chart3"></canvas>
      </div>
    </div>

    <div class="historico-toggle" style="text-align:center; margin-top: 20px;">
      <button id="toggleHistorico" class="btn alt">📋 Mostrar histórico de pedidos</button>
    </div>

<table id="histTable">
  <thead>
    <tr>
      <th id="thData" style="cursor:pointer;">Data ⬍</th>
      <th>Itens pedidos</th>
      <th>Chuva</th>
      <th>Temperatura</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>
  </main>

  <!-- Importa Chart.js e script de análise -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>
