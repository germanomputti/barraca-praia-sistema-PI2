<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Produção - Barraca de Praia</title>

  <!-- Estilos -->
  <link rel="stylesheet" href="style.css"/>
  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
</head>

<body>
  <!-- ======== CABEÇALHO ======== -->
  <header class="header">
    <h1>Produção - Barraca de Praia 🍹</h1>
  </header>

  <!-- ======== CONTEÚDO PRINCIPAL ======== -->
  <main class="container">
    <div class="card">
      <h2>Pedidos do dia</h2>

      <!-- Filtros -->
      <div class="filtros">
        <label for="filtroStatus"><strong>Filtrar por status:</strong></label>
        <select id="filtroStatus" multiple size="4">
          <option value="__ALL__" selected>Todos</option>
          <option value="Aguardando">Aguardando</option>
          <option value="Em produção">Em produção</option>
          <option value="Concluído">Concluído</option>
        </select>

        <button class="btn alt" id="btnFiltrar">
          <i class="fas fa-filter"></i> Filtrar
        </button>

        <button class="btn danger" onclick="resetHiddenOrders()">
          <i class="fas fa-eye"></i> Mostrar todos os pedidos
        </button>
      </div>

      <!-- Tabela de pedidos -->
      <table id="tabelaPedidos">
        <thead>
          <tr>
            <th onclick="sortTable('hora')">🕓 Hora do Pedido ⬍</th>
            <th onclick="sortTable('mesa')">🍽️ Mesa ⬍</th>
            <th onclick="sortTable('cliente')">👤 Cliente ⬍</th>
            <th>📦 Itens</th>
            <th>📊 Status</th>
            <th>⚙️ Ações</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </main>

  <!-- Script -->
  <script src="script.js"></script>
</body>
</html>
